# B6 — Track B: PlayWorld GRPO from the Phase-2 SFT champion (protocol §5.1).
# Parent: B4v2 (run 20260814-023603--b4v2-playworld-sft-from-p1--s42--c56ed2,
# adapter sha256:d4fcacdd...). Champion record (§6, 2026-08-14): B5 (DPO) vs
# B4v2 proxy tie on all primaries (only sig cell: adversarial pass -.037 for
# B5) -> rule-OOD tie -> GPU-hours -> champion stays B4v2; GRPO therefore
# initializes from the SFT champion, giving a clean B6-vs-B5 comparison
# (online RL vs offline preference from the SAME parent).
# Rewards: verifier_reward_function(default_playworld_verifier) — online,
# episode-level, same verifier as eval (no reward-model drift).
# Launch (Colab):
#   python scripts/run_experiment.py \
#     --config configs/experiments/b6_playworld_grpo.yaml \
#     --parent-adapter-dir runs/<b4v2-run>/artifacts/final_adapter \
#     --override lineage.parent_adapter.sha256=<b4v2 sha> \
#     --override data.source.local_path=data/train/playworld_prompts.jsonl \
#     --hf-sync-repo m97j/aw-runs-b6
# Resume after an interrupted session (same command + --resume-from hub):
#   HFCheckpointSync pushes checkpoint-N to m97j/aw-runs-b6 on every save;
#   --resume-from hub restores the newest one (or starts fresh if none).
#   save_steps=50 below bounds the loss window to <=50 optimizer steps
#   (~10% of the ~500-step B6 budget; default 200 was too coarse for GRPO).
extends:
  - ../base/project.yaml
  - ../base/runtime_colab_g4.yaml
  - ../base/model_qwen3_8b_base.yaml

experiment_name: b6-playworld-grpo
track: track_b_two_stage
phase: phase2_playworld
objective: grpo

lineage:
  initialization_mode: continue_training_existing_adapter
  parent_run_id: null   # override at launch
  parent_adapter:
    repo_id: m97j/aw-runs-b4
    revision: main
    sha256: ""   # REQUIRED at launch

data:
  source:
    local_path: data/train/playworld_prompts.jsonl

training:
  # Conservative single-GPU GRPO budget (~500 prompts x 8 rollouts):
  # comparable optimizer-step count to the DPO arms.
  learning_rate: 1.0e-6
  save_steps: 50
  num_train_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 4096
  extra:
    num_generations: 8
    # vLLM colocated rollouts (v0.6.12): generation was the bottleneck of the
    # aborted 2026-08-15 run (~17h projected on HF generate). Colocate mode
    # shares the training GPU (96GB Blackwell has ample headroom for an 8B
    # LoRA policy + 0.3-fraction KV cache). Requires `pip install -r
    # requirements/vllm.lock.txt` in the runtime BEFORE launch; if the
    # Blackwell/vLLM install fails, set use_vllm=false via --override and
    # accept slow rollouts — correctness is unaffected.
    # x18 verdict (runs/x18_vllm_probe.json, 2026-08-16): NO vLLM release is
    # ABI-clean against the image-owned torch 2.11.0+cu128 — every release
    # pins its own torch — so colocate (same-env) vLLM is impossible on this
    # image. Default = HF generate (use_vllm: false). The supported
    # accelerated path is SERVER mode with an isolated env (B6-B track):
    #   bash scripts/launch_trl_vllm_server.sh Qwen/Qwen3-8B 8000
    #   --override training.extra.use_vllm=true \
    #   --override training.extra.vllm_mode=server \
    #   --override training.extra.vllm_server_base_url=http://127.0.0.1:8000
    use_vllm: false
    vllm_mode: server
    vllm_gpu_memory_utilization: 0.3
    max_prompt_length: 2048
    max_completion_length: 768
    temperature: 0.8
    top_p: 0.95
