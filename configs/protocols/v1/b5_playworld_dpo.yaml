# B5 — Track B: PlayWorld DPO on verifier-mined pairs from the B4 policy
# (protocol §5.1; mirrors A2 exactly so B5-vs-A2 is a controlled comparison:
# identical mining recipe/budget, differing only in the parent policy line).
# Parent: B4 run 20260812-235057--b4-playworld-sft-from-p1--s42--72f4f6
#   (adapter sha256:378ba470...; lineage chain base -> B1v2 -> B4 -> B5).
# Launch (Colab):
#   python scripts/run_experiment.py \
#     --config configs/experiments/b5_playworld_dpo.yaml \
#     --parent-adapter-dir runs/<b4-run>/artifacts/final_adapter \
#     --override lineage.parent_adapter.sha256=<b4 output_adapter_sha256> \
#     --override data.source.local_path=data/train/playworld_preference_b4.jsonl \
#     --hf-sync-repo m97j/aw-runs-b5
extends:
  - ../base/project.yaml
  - ../base/runtime_colab_g4.yaml
  - ../base/model_qwen3_8b_base.yaml

experiment_name: b5-playworld-dpo
track: track_b_two_stage
phase: phase2_playworld
objective: dpo

lineage:
  initialization_mode: continue_training_existing_adapter
  parent_run_id: null   # override with the B4 run id at launch
  parent_adapter:
    repo_id: m97j/aw-runs-b4
    revision: main
    sha256: ""   # REQUIRED at launch: B4 output_adapter_sha256

data:
  source:
    local_path: data/train/playworld_preference_b4.jsonl

training:
  # A2 profile verbatim (single-variable design): low LR, single epoch.
  learning_rate: 5.0e-7
  num_train_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 4096
